services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apptracker
      POSTGRES_USER: apptracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates tables and starting configuration on the FIRST start only.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptracker -d apptracker"]
      interval: 5s
      retries: 10

  collector:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://apptracker:${POSTGRES_PASSWORD}@postgres:5432/apptracker
      USER_AGENT: ${USER_AGENT:-app-tracker-collector/1.0}

volumes:
  pgdata:
