server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Note: a location with its own add_header drops server-level headers,
    # so every location includes the security headers.
    include /etc/nginx/snippets/security-headers.inc;
    include /etc/nginx/snippets/api-proxy.inc;

    # Hashed build files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Runtime config must never be cached.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
